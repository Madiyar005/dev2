name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Кодты репозиторийден алу (Checkout)
      uses: actions/checkout@v3

    - name: Python ортасын баптау (Build кезеңі)
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Тәуелділіктерді орнату (Install кезеңі)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Тестілерді іске қосу (Test кезеңі)
      run: |
        pytest test_app.py
